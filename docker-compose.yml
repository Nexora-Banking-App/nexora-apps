services:
  mysql-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: nexora_bank
      MYSQL_USER: dbuser
      MYSQL_PASSWORD: dbpassword
    ports:
      - "3306:3306"
    volumes:
      - ./db-init/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  frontend-web:
    build: ./frontend-web
    ports:
      - "8080:80"
    depends_on:
      - api-gateway

  api-gateway:
    build: ./api-gateway
    ports:
      - "8000:8000"
    environment:
      - AUTH_SVC_URL=http://auth-service:8000
      - ACCOUNT_SVC_URL=http://account-service:8000
      - TRANSACTION_SVC_URL=http://transaction-service:8000
    depends_on:
      - auth-service
      - account-service
      - transaction-service

  auth-service:
    build: ./auth-service
    environment:
      - DB_HOST=mysql-db
      - DB_USER=dbuser
      - DB_PASSWORD=dbpassword
      - DB_NAME=nexora_bank
    depends_on:
      mysql-db:
        condition: service_healthy

  account-service:
    build: ./account-service
    environment:
      - DB_HOST=mysql-db
      - DB_USER=dbuser
      - DB_PASSWORD=dbpassword
      - DB_NAME=nexora_bank
    depends_on:
      mysql-db:
        condition: service_healthy

  transaction-service:
    build: ./transaction-service
    environment:
      - DB_HOST=mysql-db
      - DB_USER=dbuser
      - DB_PASSWORD=dbpassword
      - DB_NAME=nexora_bank
      - FRAUD_SVC_URL=http://fraud-service:8000
    depends_on:
      mysql-db:
        condition: service_healthy

  fraud-service:
    build: ./fraud-service