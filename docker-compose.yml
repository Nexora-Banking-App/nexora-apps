services:
  mysql-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: nexora_bank
      MYSQL_USER: dbuser
      MYSQL_PASSWORD: dbpassword
    ports:
      - "3306:3306"
    volumes:
      - ./db-init/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  frontend-web:
    build: ./frontend-web
    ports:
      # NGINX listens on 8080 inside the container (frontend-web/default.conf)
      - "8080:8080"
    depends_on:
      - api-gateway

  api-gateway:
    build: ./api-gateway
    ports:
      - "8000:8000"
    environment:
      - AUTH_SVC_URL=http://auth-service:8000
      - ACCOUNT_SVC_URL=http://account-service:8000
      - TRANSACTION_SVC_URL=http://transaction-service:8000
    depends_on:
      - auth-service
      - account-service
      - transaction-service

  auth-service:
    build: ./auth-service
    environment:
      - DB_HOST=mysql-db
      - DB_USER=dbuser
      - DB_PASSWORD=dbpassword
      - DB_NAME=nexora_bank
    depends_on:
      mysql-db:
        condition: service_healthy

  account-service:
    build: ./account-service
    environment:
      - DB_HOST=mysql-db
      - DB_USER=dbuser
      - DB_PASSWORD=dbpassword
      - DB_NAME=nexora_bank
    depends_on:
      mysql-db:
        condition: service_healthy

  transaction-service:
    build: ./transaction-service
    environment:
      - DB_HOST=mysql-db
      - DB_USER=dbuser
      - DB_PASSWORD=dbpassword
      - DB_NAME=nexora_bank
      - FRAUD_SVC_URL=http://fraud-service:8000
      # Outbox publisher -> local Kafka (no TLS or SASL on the laptop)
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_SECURITY_PROTOCOL=PLAINTEXT
    depends_on:
      mysql-db:
        condition: service_healthy
      kafka:
        condition: service_started

  fraud-service:
    build: ./fraud-service
    environment:
      # Event consumer -> local Kafka
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_SECURITY_PROTOCOL=PLAINTEXT
    depends_on:
      kafka:
        condition: service_started

  # Single-node Kafka (KRaft, no ZooKeeper) for local development only.
  # Staging uses the Strimzi cluster with TLS + SCRAM declared in platform-config.
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Locally the topics (transactions.events, fraud.alerts, the DLQ) are created on first use
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
