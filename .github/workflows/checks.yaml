name: "PR checks"

# Fast quality gates on every pull request. Nothing here needs AWS access;
# images are only built and pushed by ci.yaml after a merge to main.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: "Python: compile, shared-module sync, unit tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "**/requirements.txt"

      - name: Shared module is identical in every service
        run: scripts/sync-common.sh --check

      - name: Install service dependencies
        run: |
          pip install \
            -r api-gateway/requirements.txt \
            -r auth-service/requirements.txt \
            -r account-service/requirements.txt \
            -r transaction-service/requirements.txt \
            -r fraud-service/requirements.txt \
            pytest

      - name: Byte-compile all Python
        run: python -m compileall -q api-gateway auth-service account-service transaction-service fraud-service tests

      - name: Every service imports and answers its health check
        run: |
          for svc in api-gateway auth-service account-service transaction-service fraud-service; do
            echo "::group::$svc"
            (cd "$svc" && python - <<'EOF'
          from fastapi.testclient import TestClient
          import main
          with TestClient(main.app) as client:
              assert client.get("/health/liveness").status_code == 200
              assert client.get("/metrics").status_code == 200
          print("ok")
          EOF
            )
            echo "::endgroup::"
          done

      - name: Unit tests
        run: pytest tests/unit -v

  compose:
    name: "docker-compose.yml is valid"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config -q
