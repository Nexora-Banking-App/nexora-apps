name: "PR checks"

# Quality gates on every pull request. Nothing here needs AWS access;
# images are only pushed by ci.yaml after a merge to main.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo:
    name: "Repo: shared module in sync, compose file valid"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shared module is identical in every service
        run: scripts/sync-common.sh --check
      - name: docker-compose.yml is valid
        run: docker compose config -q

  python:
    # One job per service, each with its own dependencies, exactly like its image.
    name: "Python (${{ matrix.service }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, auth-service, account-service, transaction-service, fraud-service]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        run: pip install -r ${{ matrix.service }}/requirements.txt pytest httpx

      - name: Byte-compile
        run: python -m compileall -q ${{ matrix.service }}

      - name: Service imports and answers its health check
        working-directory: ${{ matrix.service }}
        run: |
          python - <<'EOF'
          from fastapi.testclient import TestClient
          import main
          with TestClient(main.app) as client:
              assert client.get("/health/liveness").status_code == 200
              assert client.get("/metrics").status_code == 200
          print("ok")
          EOF

      - name: Unit tests
        if: matrix.service == 'fraud-service'
        run: pytest tests/unit -v

  image:
    # Build every image and scan it with the same gate the release pipeline uses,
    # so a broken Dockerfile or a CRITICAL CVE is found on the PR, not after merge.
    name: "Image build + Trivy (${{ matrix.service }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [frontend-web, api-gateway, auth-service, account-service, transaction-service, fraud-service]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build -t "nexora/${{ matrix.service }}:pr" ./${{ matrix.service }}
          docker save "nexora/${{ matrix.service }}:pr" -o image.tar

      - name: Trivy scan (CRITICAL, fixable)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: image.tar
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'
