name: "CI - Secure Supply Chain Pipeline"

on:
  push:
    branches:
      - main
    paths:
      - '**/*.py'
      - '**/Dockerfile'
      - '**/requirements.txt'
      - 'frontend-web/**'
      - '.github/workflows/ci.yaml'
  workflow_dispatch:

# Least privilege: every job asks only for what it needs.
permissions:
  contents: read

# One release pipeline at a time, so two pushes cannot race each other to ECR
# or open two promotion PRs out of order.
concurrency:
  group: ci-main
  cancel-in-progress: false

jobs:
  build-scan-push:
    name: "Build, Scan, & Push"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # AWS OIDC login and keyless Cosign signing
    strategy:
      fail-fast: false
      matrix:
        service:
          - frontend-web
          - api-gateway
          - auth-service
          - account-service
          - transaction-service
          - fraud-service

    outputs:
      image_tag: ${{ steps.vars.outputs.sha_short }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set Image Tag Variable
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # Build and scan BEFORE touching AWS: a vulnerable image never gets
      # credentials, and scan failures do not depend on the cloud account.
      - name: Build Docker Image
        env:
          LOCAL_IMAGE: nexora/${{ matrix.service }}:${{ steps.vars.outputs.sha_short }}
        run: |
          docker build -t "$LOCAL_IMAGE" ./${{ matrix.service }}
          docker save "$LOCAL_IMAGE" -o image.tar

      - name: Run Trivy CVE Vulnerability Scanner
        # Pinned to the commit of release v0.36.0. A moving ref (master) lets any
        # future upstream change run inside this pipeline with AWS credentials.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: image.tar
          format: 'table'
          exit-code: '1' # Fails the build if vulnerabilities are found!
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR Repository Exists
        run: |
          aws ecr describe-repositories --repository-names "nexora/${{ matrix.service }}" --region us-east-1 || \
          aws ecr create-repository --repository-name "nexora/${{ matrix.service }}" --region us-east-1 \
            --image-scanning-configuration scanOnPush=true --image-tag-mutability IMMUTABLE

      - name: Push Docker Image to ECR
        id: push
        env:
          LOCAL_IMAGE: nexora/${{ matrix.service }}:${{ steps.vars.outputs.sha_short }}
          REMOTE_IMAGE: ${{ steps.login-ecr.outputs.registry }}/nexora/${{ matrix.service }}:${{ steps.vars.outputs.sha_short }}
        run: |
          docker tag "$LOCAL_IMAGE" "$REMOTE_IMAGE"
          docker push "$REMOTE_IMAGE"
          # The digest identifies exactly the bytes that were pushed
          echo "digest_ref=$(docker inspect --format='{{index .RepoDigests 0}}' "$REMOTE_IMAGE")" >> $GITHUB_OUTPUT

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.3

      - name: Sign the ECR Image
        # Signed by digest, not by tag: a tag can be moved, a digest cannot.
        run: cosign sign --yes "${{ steps.push.outputs.digest_ref }}"

  # =========================================================================
  # GitOps Promotion (The PR Bot)
  # =========================================================================
  promote-to-staging:
    name: "Automated GitOps Promotion"
    needs: build-scan-push
    runs-on: ubuntu-latest
    permissions:
      contents: read # the PR in app-manifests is opened with GITOPS_PAT, not GITHUB_TOKEN
    steps:
      - name: Checkout app-manifests repository
        uses: actions/checkout@v7
        with:
          repository: Nexora-Banking-App/app-manifests
          token: ${{ secrets.GITOPS_PAT }}
          path: app-manifests

      - name: Update Kustomize Image Tags
        working-directory: app-manifests/overlays/staging
        env:
          IMAGE_TAG: ${{ needs.build-scan-push.outputs.image_tag }}
          REGISTRY: 800770414458.dkr.ecr.us-east-1.amazonaws.com
        run: |
          for service in frontend-web api-gateway auth-service account-service transaction-service fraud-service; do
            kustomize edit set image ghcr.io/nexora-platform/$service=$REGISTRY/nexora/$service:$IMAGE_TAG
          done

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          path: app-manifests
          token: ${{ secrets.GITOPS_PAT }}
          commit-message: "deploy: update staging workloads to ${{ needs.build-scan-push.outputs.image_tag }}"
          title: "🚀 Deploy: Promote staging workloads to ${{ needs.build-scan-push.outputs.image_tag }}"
          body: |
            ## Automated GitOps Promotion
            This PR updates the staging Kustomize manifests to the newly scanned and signed image tag.

            **Commit SHA:** `${{ needs.build-scan-push.outputs.image_tag }}`

            Merging this PR will trigger ArgoCD to automatically synchronize the cluster.
          branch: "promote/staging-${{ needs.build-scan-push.outputs.image_tag }}"
          base: main
          delete-branch: true
