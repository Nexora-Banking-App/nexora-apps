name: "CI - Secure Supply Chain Pipeline"

on:
  push:
    branches:
      - main
    # Only trigger if Python files or Dockerfiles change
    paths:
      - '**/*.py'
      - '**/Dockerfile'
      - '**/requirements.txt'
      - 'frontend-web/**'
  workflow_dispatch:

permissions:
  id-token: write     # Required for AWS OIDC and Cosign
  contents: write     # Required to checkout code and modify manifests
  pull-requests: write # Required for the GitOps PR bot

jobs:
  build-scan-push:
    name: "Build, Scan, & Push"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - frontend-web
          - api-gateway
          - auth-service
          - account-service
          - transaction-service
          - fraud-service

    outputs:
      image_tag: ${{ steps.vars.outputs.sha_short }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Image Tag Variable
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 1. Self-Healing ECR Repository Check
      - name: Ensure ECR Repository Exists
        run: |
          aws ecr describe-repositories --repository-names "nexora/${{ matrix.service }}" --region us-east-1 || \
          aws ecr create-repository --repository-name "nexora/${{ matrix.service }}" --region us-east-1 --image-scanning-configuration scanOnPush=true

      # 2. Build the Docker Image
      - name: Build Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: nexora/${{ matrix.service }}
          IMAGE_TAG: ${{ steps.vars.outputs.sha_short }}
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG ./${{ matrix.service }}
          # Save image name to file for Trivy to scan locally before pushing
          docker save $REGISTRY/$REPOSITORY:$IMAGE_TAG -o image.tar

      # 3. Vulnerability Gating (Trivy)
      - name: Run Trivy CVE Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          input: /github/workspace/image.tar
          format: 'table'
          exit-code: '1' # Fails the build if vulnerabilities are found!
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL' # Only fail on Critical CVEs

      # 4. Push to ECR (Only happens if Trivy passes!)
      - name: Push Docker Image to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: nexora/${{ matrix.service }}
          IMAGE_TAG: ${{ steps.vars.outputs.sha_short }}
        run: |
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      # 5. Cryptographic Image Signing (Cosign Keyless)
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0
      - name: Sign the ECR Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: nexora/${{ matrix.service }}
          IMAGE_TAG: ${{ steps.vars.outputs.sha_short }}
        run: |
          cosign sign --yes $REGISTRY/$REPOSITORY:$IMAGE_TAG

  # =========================================================================
  # 6. GitOps Promotion (The PR Bot)
  # =========================================================================
  promote-to-staging:
    name: "Automated GitOps Promotion"
    needs: build-scan-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app-manifests repository
        uses: actions/checkout@v4
        with:
          repository: Nexora-Banking-App/app-manifests
          token: ${{ secrets.GITOPS_PAT }} # We need a Personal Access Token to commit to another repo
          path: app-manifests

      - name: Update Kustomize Image Digests
        working-directory: app-manifests/overlays/staging
        env:
          IMAGE_TAG: ${{ needs.build-scan-push.outputs.image_tag }}
          REGISTRY: 800770414458.dkr.ecr.us-east-1.amazonaws.com
        run: |
          # Automatically update kustomization.yaml to point to the new immutable SHA tag
          for service in frontend-web api-gateway auth-service account-service transaction-service fraud-service; do
            kustomize edit set image ghcr.io/nexora-platform/$service=$REGISTRY/nexora/$service:$IMAGE_TAG
          done

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          path: app-manifests
          token: ${{ secrets.GITOPS_PAT }}
          commit-message: "deploy: update staging workloads to ${{ needs.build-scan-push.outputs.image_tag }}"
          title: "🚀 Deploy: Promote staging workloads to ${{ needs.build-scan-push.outputs.image_tag }}"
          body: |
            ## Automated GitOps Promotion
            This PR updates the staging Kustomize manifests to use the newly built, scanned, and signed image digests.
            
            **Commit SHA:** `${{ needs.build-scan-push.outputs.image_tag }}`
            
            Merging this PR will trigger ArgoCD to automatically synchronize the cluster.
          branch: "promote/staging-${{ needs.build-scan-push.outputs.image_tag }}"
          base: main