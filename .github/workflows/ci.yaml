name: "CI - Build and Push Container Images"

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger anytime

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    name: "Build ${{ matrix.service }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Builds all 6 microservices concurrently!
        service:
          - frontend-web
          - api-gateway
          - auth-service
          - account-service
          - transaction-service
          - fraud-service

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Self-Healing: Create the ECR repository automatically if it doesn't exist!
      - name: Ensure ECR Repository Exists
        run: |
          aws ecr describe-repositories --repository-names "nexora/${{ matrix.service }}" --region us-east-1 || \
          aws ecr create-repository \
            --repository-name "nexora/${{ matrix.service }}" \
            --region us-east-1 \
            --image-scanning-configuration scanOnPush=true

      # Build and push using immutable Git SHA + latest tag
      - name: Build and Push Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: "nexora/${{ matrix.service }}"
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG -t $REGISTRY/$REPOSITORY:latest ./${{ matrix.service }}
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$REPOSITORY:latest