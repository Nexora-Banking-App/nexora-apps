apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: nexora-core-banking
  description: Core banking platform (accounts, transfers, fraud checks)
spec:
  owner: platform-team
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: api-gateway
  description: Edge router, JWT verification, rate limiting, correlation IDs
  tags:
    - python
    - fastapi
spec:
  type: service
  lifecycle: production
  owner: edge-team
  system: nexora-core-banking
  dependsOn:
    - component:auth-service
    - component:account-service
    - component:transaction-service
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: auth-service
  description: Signup, login, JWT issuing, welcome-grant retry
  tags:
    - python
    - bcrypt
spec:
  type: service
  lifecycle: production
  owner: identity-team
  system: nexora-core-banking
  dependsOn:
    - component:transaction-service
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: account-service
  description: Read-only balance and transaction history
  tags:
    - python
    - mysql
spec:
  type: service
  lifecycle: production
  owner: ledger-team
  system: nexora-core-banking
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: transaction-service
  description: Sole writer of the ledger - idempotent transfers, row locking, transactional outbox
  tags:
    - python
    - mysql
spec:
  type: service
  lifecycle: production
  owner: ledger-team
  system: nexora-core-banking
  dependsOn:
    - component:fraud-service
    - resource:nexora-mysql
    - resource:nexora-kafka
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: fraud-service
  description: Stateless rule-based fraud scoring and Kafka event consumer
  tags:
    - python
    - hpa
spec:
  type: service
  lifecycle: production
  owner: risk-team
  system: nexora-core-banking
  dependsOn:
    - resource:nexora-kafka
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: frontend-web
  description: Single-page web UI served by NGINX
  tags:
    - nginx
    - javascript
spec:
  type: website
  lifecycle: production
  owner: edge-team
  system: nexora-core-banking
  dependsOn:
    - component:api-gateway
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: nexora-mysql
  description: Amazon RDS MySQL 8.0 - users, accounts, transactions, idempotency records, outbox
spec:
  type: database
  owner: ledger-team
  system: nexora-core-banking
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: nexora-kafka
  description: Strimzi Kafka cluster (staging) - transactions.events, fraud.alerts, DLQ
spec:
  type: message-broker
  owner: platform-team
  system: nexora-core-banking
