apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: nexora-core-banking
  description: The core banking transaction and ledger system
spec:
  owner: platform-team
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: api-gateway
  description: Edge router and JWT authentication verification
  tags:
    - python
    - fastapi
spec:
  type: service
  lifecycle: production
  owner: edge-team
  system: nexora-core-banking
  dependsOn:
    - component:auth-service
    - component:account-service
    - component:transaction-service
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: auth-service
  description: User authentication, hashing, and token authority
  tags:
    - python
    - bcrypt
spec:
  type: service
  lifecycle: production
  owner: identity-team
  system: nexora-core-banking
  dependsOn:
    - component:transaction-service
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: account-service
  description: Strictly read-only CQRS ledger balance inquiries
  tags:
    - python
    - mysql
spec:
  type: service
  lifecycle: production
  owner: ledger-team
  system: nexora-core-banking
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: transaction-service
  description: ACID execution engine with deterministic locking
  tags:
    - python
    - mysql
spec:
  type: service
  lifecycle: production
  owner: ledger-team
  system: nexora-core-banking
  dependsOn:
    - component:fraud-service
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: fraud-service
  description: Compute-heavy mathematical risk assessment engine
  tags:
    - python
    - hpa
spec:
  type: service
  lifecycle: production
  owner: risk-team
  system: nexora-core-banking   