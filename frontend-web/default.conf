server {
    listen 8080;
    server_tokens off;

    # Baseline browser hardening. No Content-Security-Policy yet: the page loads
    # Tailwind from a CDN and uses inline scripts, which a strict policy would block.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}