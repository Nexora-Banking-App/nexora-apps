<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nexora Banking</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white font-sans h-screen flex flex-col items-center justify-center">

    <!-- LOGIN -->
    <div id="loginScreen" class="bg-slate-800 p-8 rounded-xl shadow-2xl w-full max-w-sm border border-slate-700">
        <div class="flex items-center justify-center mb-6">
            <svg class="w-10 h-10 text-blue-500 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
            <h1 class="text-3xl font-bold text-blue-400">Nexora Bank</h1>
        </div>
        <input id="loginUser" type="text" placeholder="Username" class="w-full mb-3 p-3 rounded bg-slate-700 text-white outline-none focus:ring-2 focus:ring-blue-500">
        <input id="loginPass" type="password" placeholder="Password" class="w-full mb-6 p-3 rounded bg-slate-700 text-white outline-none focus:ring-2 focus:ring-blue-500">
        <button onclick="login()" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-lg font-semibold mb-3 transition">Secure Login</button>
        <p class="text-center text-sm text-slate-400">New user? <button onclick="showScreen('signupScreen')" class="text-blue-400 hover:underline">Create account</button></p>
        <p id="loginError" class="text-red-400 text-center mt-3 text-sm hidden"></p>
    </div>

    <!-- SIGNUP -->
    <div id="signupScreen" class="hidden bg-slate-800 p-8 rounded-xl shadow-2xl w-full max-w-sm border border-slate-700">
        <h2 class="text-2xl font-bold text-blue-400 mb-6 text-center">Open an Account</h2>
        <input id="regUser" type="text" placeholder="Username" class="w-full mb-3 p-3 rounded bg-slate-700 text-white outline-none">
        <input id="regEmail" type="email" placeholder="Email Address" class="w-full mb-3 p-3 rounded bg-slate-700 text-white outline-none">
        <input id="regPhone" type="tel" placeholder="Phone Number" class="w-full mb-3 p-3 rounded bg-slate-700 text-white outline-none">
        <input id="regPass" type="password" placeholder="Password" class="w-full mb-6 p-3 rounded bg-slate-700 text-white outline-none">
        <button onclick="signup()" class="w-full bg-green-600 hover:bg-green-500 py-3 rounded-lg font-semibold mb-3 transition">Register ($1000 Grant)</button>
        <p class="text-center text-sm text-slate-400">Have an account? <button onclick="showScreen('loginScreen')" class="text-blue-400 hover:underline">Log in</button></p>
        <p id="signupError" class="text-red-400 text-center mt-3 text-sm hidden"></p>
    </div>

    <!-- LOADING -->
    <div id="loadingScreen" class="hidden flex flex-col items-center justify-center">
        <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-blue-500 mb-4"></div>
        <h2 class="text-xl font-semibold text-blue-400">Setting up your ledger...</h2>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboardScreen" class="hidden bg-slate-800 p-8 rounded-xl shadow-2xl w-full max-w-2xl border border-slate-700">
        <div class="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
            <h1 class="text-2xl font-bold text-white">Welcome, <span id="dashUser" class="text-blue-400 font-semibold">User</span>!</h1>
            <button onclick="logout()" class="text-sm text-slate-400 hover:text-white transition">Logout</button>
        </div>
        
        <div class="grid grid-cols-2 gap-6 mb-6">
            <div class="bg-slate-700 p-6 rounded-lg shadow-inner">
                <h2 class="text-sm text-slate-400 uppercase tracking-wide">Available Balance</h2>
                <p class="text-4xl font-mono mt-2 text-green-400 font-bold" id="balanceDisplay">$1,000.00</p>
            </div>
            <div class="bg-slate-700 p-6 rounded-lg shadow-inner">
                <h2 class="text-sm text-slate-400 uppercase tracking-wide mb-3">Transfer Funds</h2>
                <input id="transferUser" type="text" placeholder="Receiver's Username" class="w-full mb-2 p-2 text-sm rounded bg-slate-800 text-white outline-none border border-slate-600 focus:border-blue-500">
                <input id="transferAmount" type="number" step="0.01" placeholder="Amount ($)" class="w-full mb-3 p-2 text-sm rounded bg-slate-800 text-white outline-none border border-slate-600 focus:border-blue-500">
                <button onclick="transfer()" class="w-full bg-blue-600 hover:bg-blue-500 py-2 rounded font-semibold text-sm transition">Send Funds</button>
                <p id="transferMsg" class="text-center mt-2 text-xs hidden"></p>
            </div>
        </div>

        <h2 class="text-sm text-slate-400 uppercase tracking-wide mb-3">Recent Transactions</h2>
        <div class="bg-slate-700 rounded-lg overflow-hidden h-44 overflow-y-auto shadow-inner">
            <table class="w-full text-sm text-left">
                <tbody id="txTable">
                    <tr><td colspan="3" class="p-4 text-center text-slate-400">Loading ledger...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const API_URL = "http://localhost:8000/api";

        function showScreen(id) {
            ['loginScreen', 'signupScreen', 'loadingScreen', 'dashboardScreen'].forEach(s => document.getElementById(s).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        async function signup() {
            const body = {
                username: document.getElementById('regUser').value.trim(),
                email: document.getElementById('regEmail').value.trim(),
                phone: document.getElementById('regPhone').value.trim(),
                password: document.getElementById('regPass').value
            };
            const res = await fetch(`${API_URL}/signup`, { 
                method: 'POST', 
                body: JSON.stringify(body), 
                headers: {'Content-Type':'application/json'} 
            });
            if(res.ok) {
                showScreen('loadingScreen');
                setTimeout(() => showScreen('loginScreen'), 1500);
            } else {
                const err = await res.json();
                document.getElementById('signupError').innerText = err.detail || "Registration failed";
                document.getElementById('signupError').classList.remove('hidden');
            }
        }

        async function login() {
            const usernameInput = document.getElementById('loginUser').value.trim();
            const passwordInput = document.getElementById('loginPass').value;
            
            const res = await fetch(`${API_URL}/login`, { 
                method: 'POST', 
                body: JSON.stringify({username: usernameInput, password: passwordInput}), 
                headers: {'Content-Type':'application/json'} 
            });
            const data = await res.json();
            
            if(res.ok) {
                // Using sessionStorage so each tab is 100% independent!
                sessionStorage.setItem("jwt_token", data.access_token);
                sessionStorage.setItem("active_username", data.username);
                document.getElementById('dashUser').innerText = data.username;
                showScreen('dashboardScreen');
                loadDashboard();
            } else {
                document.getElementById('loginError').innerText = data.detail || "Invalid credentials";
                document.getElementById('loginError').classList.remove('hidden');
            }
        }

        async function loadDashboard() {
            const token = sessionStorage.getItem("jwt_token");
            const username = sessionStorage.getItem("active_username");

            if(!token || !username) {
                logout();
                return;
            }

            document.getElementById('dashUser').innerText = username;
            
            try {
                const res = await fetch(`${API_URL}/account/me?limit=10&offset=0`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if(res.status === 401) {
                    logout();
                    return;
                }
                
                const data = await res.json();
                if(res.ok) {
                    document.getElementById('dashUser').innerText = data.username || username;
                    document.getElementById('balanceDisplay').innerText = `$${parseFloat(data.balance).toFixed(2)}`;
                    
                    if (data.transactions && data.transactions.length > 0) {
                        document.getElementById('txTable').innerHTML = data.transactions.map(tx => {
                            const isReceiver = tx.receiver_name === (data.username || username);
                            const sign = isReceiver ? '+' : '-';
                            const color = isReceiver ? 'text-green-400' : 'text-red-400';
                            const label = isReceiver ? `From ${tx.sender_name}` : `To ${tx.receiver_name}`;
                            
                            return `
                            <tr class="border-b border-slate-600">
                                <td class="p-3 text-slate-300 font-medium">${label}</td>
                                <td class="p-3 font-mono font-bold text-right ${color}">${sign}$${parseFloat(tx.amount).toFixed(2)}</td>
                                <td class="p-3 text-xs text-slate-400 text-right">${tx.timestamp}</td>
                            </tr>`;
                        }).join('');
                    } else {
                        document.getElementById('txTable').innerHTML = `<tr><td colspan="3" class="p-4 text-center text-slate-400">No transactions recorded yet.</td></tr>`;
                    }
                }
            } catch (err) {
                console.error("Dashboard fetch error:", err);
            }
        }

        async function transfer() {
            const token = sessionStorage.getItem("jwt_token");
            const recv = document.getElementById('transferUser').value.trim();
            const amt = document.getElementById('transferAmount').value;
            const msgBox = document.getElementById('transferMsg');
            const idempotencyKey = crypto.randomUUID();

            msgBox.classList.remove('hidden', 'text-red-400', 'text-green-400');
            msgBox.innerText = "Processing transfer...";

            try {
                const res = await fetch(`${API_URL}/transfer`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`,
                        'Idempotency-Key': idempotencyKey
                    },
                    body: JSON.stringify({ receiver_username: recv, amount: amt })
                });

                const data = await res.json();
                if(res.ok) {
                    msgBox.classList.add('text-green-400');
                    msgBox.innerText = data.message;
                    loadDashboard();
                } else {
                    msgBox.classList.add('text-red-400');
                    msgBox.innerText = data.detail || "Transfer declined.";
                }
            } catch (err) {
                msgBox.classList.add('text-red-400');
                msgBox.innerText = "Network error during transfer.";
            }
        }

        function logout() {
            sessionStorage.clear();
            showScreen('loginScreen');
        }

        // On initial tab load:
        const savedToken = sessionStorage.getItem("jwt_token");
        if(savedToken) {
            showScreen('dashboardScreen');
            loadDashboard();
        } else {
            showScreen('loginScreen');
        }
    </script>
</body>
</html>
